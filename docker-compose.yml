services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: agentruntime
      POSTGRES_USER: agentruntime
      POSTGRES_PASSWORD: agentruntime

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentruntime -d agentruntime"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      APP_NAME: AgentRuntime
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://agentruntime:agentruntime@postgres:5432/agentruntime

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: